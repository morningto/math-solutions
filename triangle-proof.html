<style>

<body>

<!-- Header -->
<div class="header">
  <h1><span class="emoji">📐</span>初中几何证明 · 等腰三角形中的全等与线段关系</h1>
  <div class="problem-text">
    <strong>题目：</strong>△ABC 中，AB = AC，点 D 在 AB 边上，点 E 在 AC 的延长线上，且 CE = BD，连接 DE 交 BC 于点 F。
    (1) 求证：EF = DF　(2) 过点 D 作 DG⊥BC，垂足为 G，求证：BC = 2FG
  </div>
</div>

<!-- Step Navigation -->
<div class="step-nav" id="stepNav">
  <button class="step-btn active" data-step="1">1</button><span class="step-label">审题</span>
  <button class="step-btn" data-step="2">2</button><span class="step-label">辅助线</span>
  <button class="step-btn" data-step="3">3</button><span class="step-label">全等①</span>
  <button class="step-btn" data-step="4">4</button><span class="step-label">全等②</span>
  <button class="step-btn" data-step="5">5</button><span class="step-label">第⑴问</span>
  <button class="step-btn" data-step="6">6</button><span class="step-label">第⑵问</span>
  <button class="step-btn" data-step="7">7</button><span class="step-label">总结</span>
</div>

<!-- Main Content -->
<div class="main-content">
  <!-- Canvas Panel -->
  <div class="canvas-panel">
    <canvas id="geoCanvas" width="700" height="520"></canvas>
  </div>
  <!-- Proof Panel -->
  <div class="proof-panel" id="proofPanel"></div>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
  <button class="nav-btn" id="prevBtn" disabled>◀ 上一步</button>
  <span class="step-indicator" id="stepIndicator">步骤 1 / 7</span>
  <button class="nav-btn primary" id="nextBtn">下一步 ▶</button>
</div>

<script>
// ==================== GEOMETRY DATA ====================
const B = {x: 130, y: 370};
const C = {x: 540, y: 370};
const A = {x: 335, y: 55};
const t = 0.35; // BD/BA ratio

// D on AB: D = B + t*(A - B)
const D = {x: B.x + t*(A.x - B.x), y: B.y + t*(A.y - B.y)};

// E on AC extension beyond C: E = C + t_e * (C - A) where CE = BD
// BD = t * BA, CE should = BD. |CA| direction from A to C.
// AC extension beyond C: direction = (C-A)/|CA|
const CA = {x: C.x - A.x, y: C.y - A.y};
const lenCA = Math.sqrt(CA.x*CA.x + CA.y*CA.y);
const BA_vec = {x: A.x - B.x, y: A.y - B.y};
const lenBA = Math.sqrt(BA_vec.x*BA_vec.x + BA_vec.y*BA_vec.y);
const BD_len = t * lenBA;
const CE_ratio = BD_len / lenCA; // CE/CA
const E = {x: C.x + CE_ratio * CA.x, y: C.y + CE_ratio * CA.y};

// F = DE ∩ BC. BC is y = B.y. Parametric on DE: P = D + s*(E-D)
// P.y = D.y + s*(E.y - D.y) = B.y => s = (B.y - D.y)/(E.y - D.y)
const s_f = (B.y - D.y) / (E.y - D.y);
const F = {x: D.x + s_f*(E.x - D.x), y: B.y};

// G = foot of perpendicular from D to BC (BC is horizontal y=370)
const G = {x: D.x, y: B.y};

// H = foot of perpendicular from E to line BC (extended)
const H = {x: E.x, y: B.y};

// ==================== DRAWING HELPERS ====================
const canvas = document.getElementById('geoCanvas');
const ctx = canvas.getContext('2d');

function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function drawLine(p1, p2, color='#38bdf8', width=2, dash=[]) {
  ctx.beginPath();
  ctx.setLineDash(dash);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawPoint(p, color='#e2e8f0', radius=3.5) {
  ctx.beginPath();
  ctx.fillStyle = color;
  ctx.arc(p.x, p.y, radius, 0, Math.PI*2);
  ctx.fill();
}

function drawLabel(text, p, dx=0, dy=0, color='#e2e8f0', size=15) {
  ctx.font = `bold ${size}px -apple-system, sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, p.x + dx, p.y + dy);
}

function drawAngleArc(vertex, p1, p2, radius, color='#fb923c', width=1.5) {
  const a1 = Math.atan2(p1.y - vertex.y, p1.x - vertex.x);
  const a2 = Math.atan2(p2.y - vertex.y, p2.x - vertex.x);
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  // Determine shorter arc direction
  let start = a1, end = a2;
  let diff = end - start;
  if (diff > Math.PI) start += 2*Math.PI;
  if (diff < -Math.PI) end += 2*Math.PI;
  ctx.arc(vertex.x, vertex.y, radius, Math.min(start,end), Math.max(start,end));
  ctx.stroke();
}

function drawRightAngle(vertex, dir1, dir2, size=10, color='rgba(255,255,255,0.7)') {
  // dir1, dir2 are unit direction vectors from vertex
  const p1 = {x: vertex.x + dir1.x*size, y: vertex.y + dir1.y*size};
  const corner = {x: vertex.x + dir1.x*size + dir2.x*size, y: vertex.y + dir1.y*size + dir2.y*size};
  const p2 = {x: vertex.x + dir2.x*size, y: vertex.y + dir2.y*size};
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(corner.x, corner.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.stroke();
}

function drawTickMark(p1, p2, numTicks=1, color='#4ade80') {
  const mx = (p1.x+p2.x)/2, my = (p1.y+p2.y)/2;
  const dx = p2.x-p1.x, dy = p2.y-p1.y;
  const len = Math.sqrt(dx*dx+dy*dy);
  const nx = -dy/len, ny = dx/len; // perpendicular
  const tickLen = 8;
  const gap = 5;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  for (let i = 0; i < numTicks; i++) {
    const offset = (i - (numTicks-1)/2) * gap;
    const cx = mx + (dx/len)*offset;
    const cy = my + (dy/len)*offset;
    ctx.beginPath();
    ctx.moveTo(cx - nx*tickLen, cy - ny*tickLen);
    ctx.lineTo(cx + nx*tickLen, cy + ny*tickLen);
    ctx.stroke();
  }
}

function drawTriangleFill(p1, p2, p3, color) {
  ctx.beginPath();
  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.lineTo(p3.x, p3.y);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

// ==================== STEP DRAWINGS ====================
function drawStep1() {
  clearCanvas();
  // Triangle ABC
  drawLine(A, B, '#38bdf8', 2.5);
  drawLine(A, C, '#38bdf8', 2.5);
  drawLine(B, C, '#38bdf8', 2.5);
  // Extend AC to E
  drawLine(C, E, '#38bdf8', 1.5, [6,4]);
  // DE line
  drawLine(D, E, '#fb923c', 2);
  // Points
  drawPoint(A, '#38bdf8', 4);
  drawPoint(B, '#38bdf8', 4);
  drawPoint(C, '#38bdf8', 4);
  drawPoint(D, '#fbbf24', 4);
  drawPoint(E, '#fbbf24', 4);
  drawPoint(F, '#f87171', 4);
  // Labels
  drawLabel('A', A, 0, -18, '#38bdf8');
  drawLabel('B', B, -18, 14, '#38bdf8');
  drawLabel('C', C, 14, 14, '#38bdf8');
  drawLabel('D', D, -18, -8, '#fbbf24');
  drawLabel('E', E, 14, 12, '#fbbf24');
  drawLabel('F', F, 0, 18, '#f87171');
  // Tick marks: AB = AC (single tick)
  drawTickMark(A, B, 1, '#4ade80');
  drawTickMark(A, C, 1, '#4ade80');
  // Tick marks: BD = CE (double tick)
  drawTickMark(B, D, 2, '#4ade80');
  drawTickMark(C, E, 2, '#4ade80');
  // Angle arcs at B and C
  drawAngleArc(B, A, C, 28, '#fb923c', 2);
  drawAngleArc(C, B, A, 28, '#fb923c', 2);
  // β labels
  drawLabel('β', B, 22, -14, '#fb923c', 13);
  drawLabel('β', C, -20, -14, '#fb923c', 13);
}

function drawStep2() {
  clearCanvas();
  // Base figure
  drawLine(A, B, '#38bdf8', 1.5);
  drawLine(A, C, '#38bdf8', 1.5);
  drawLine(B, C, '#38bdf8', 2);
  drawLine(C, E, '#38bdf8', 1.2, [6,4]);
  drawLine(D, E, '#fb923c', 1.5);

  // BC extended to H
  drawLine(C, H, '#475569', 1.5, [4,4]);

  // DG perpendicular (purple dashed)
  drawLine(D, G, '#a78bfa', 2.5, [6,3]);
  // EH perpendicular (purple dashed)
  drawLine(E, H, '#a78bfa', 2.5, [6,3]);

  // Right angle marks
  drawRightAngle(G, {x:0, y:-1}, {x:1, y:0}, 10, '#a78bfa');
  drawRightAngle(H, {x:0, y:-1}, {x:-1, y:0}, 10, '#a78bfa');

  // Highlight DG = EH
  drawLabel('DG', {x:(D.x+G.x)/2, y:(D.y+G.y)/2}, -22, 0, '#a78bfa', 13);
  drawLabel('EH', {x:(E.x+H.x)/2, y:(E.y+H.y)/2}, 22, 0, '#a78bfa', 13);

  // Points
  drawPoint(A, '#38bdf8', 3);
  drawPoint(B, '#38bdf8', 4);
  drawPoint(C, '#38bdf8', 4);
  drawPoint(D, '#fbbf24', 4);
  drawPoint(E, '#fbbf24', 4);
  drawPoint(F, '#f87171', 4);
  drawPoint(G, '#a78bfa', 4);
  drawPoint(H, '#a78bfa', 4);

  // Labels
  drawLabel('A', A, 0, -18, '#38bdf8');
  drawLabel('B', B, -18, 14, '#38bdf8');
  drawLabel('C', C, 0, 18, '#38bdf8');
  drawLabel('D', D, -20, -8, '#fbbf24');
  drawLabel('E', E, 14, 12, '#fbbf24');
  drawLabel('F', F, 6, 18, '#f87171');
  drawLabel('G', G, -4, 18, '#a78bfa');
  drawLabel('H', H, 4, 18, '#a78bfa');

  // Tick marks
  drawTickMark(B, D, 2, '#4ade80');
  drawTickMark(C, E, 2, '#4ade80');
}

function drawStep3() {
  clearCanvas();
  // Highlight triangles BDG and CEH
  drawTriangleFill(B, D, G, 'rgba(56,189,248,0.12)');
  drawTriangleFill(C, E, H, 'rgba(251,146,60,0.12)');

  // Base figure (lighter)
  drawLine(A, B, '#334155', 1);
  drawLine(A, C, '#334155', 1);
  drawLine(B, C, '#38bdf8', 2);
  drawLine(C, E, '#475569', 1, [6,4]);
  drawLine(D, E, '#475569', 1);
  drawLine(C, H, '#475569', 1.5, [4,4]);

  // Triangle BDG edges
  drawLine(B, D, '#38bdf8', 2.5);
  drawLine(D, G, '#a78bfa', 2.5, [6,3]);
  drawLine(B, G, '#38bdf8', 2);

  // Triangle CEH edges
  drawLine(C, E, '#fb923c', 2.5);
  drawLine(E, H, '#a78bfa', 2.5, [6,3]);
  drawLine(C, H, '#fb923c', 2);

  // Right angle marks
  drawRightAngle(G, {x:0, y:-1}, {x:1, y:0}, 10, '#a78bfa');
  drawRightAngle(H, {x:0, y:-1}, {x:-1, y:0}, 10, '#a78bfa');

  // Angle arcs
  drawAngleArc(B, D, G, 24, '#38bdf8', 2);
  // ∠HCE = β (vertical angle of ∠ACB)
  drawAngleArc(C, H, E, 24, '#fb923c', 2);

  drawLabel('β', B, 20, -10, '#38bdf8', 13);
  drawLabel('β', C, 14, 10, '#fb923c', 13);

  // Tick marks BD = CE
  drawTickMark(B, D, 2, '#4ade80');
  drawTickMark(C, E, 2, '#4ade80');

  // Labels showing congruence result
  drawTickMark(D, G, 3, '#e879f9');
  drawTickMark(E, H, 3, '#e879f9');

  // Points
  drawPoint(A, '#475569', 3);
  drawPoint(B, '#38bdf8', 4);
  drawPoint(C, '#fb923c', 4);
  drawPoint(D, '#38bdf8', 4);
  drawPoint(E, '#fb923c', 4);
  drawPoint(F, '#f87171', 3);
  drawPoint(G, '#a78bfa', 4);
  drawPoint(H, '#a78bfa', 4);

  drawLabel('A', A, 0, -18, '#475569');
  drawLabel('B', B, -18, 14, '#38bdf8');
  drawLabel('C', C, 0, 18, '#38bdf8');
  drawLabel('D', D, -20, -8, '#38bdf8');
  drawLabel('E', E, 14, 12, '#fb923c');
  drawLabel('F', F, 6, 18, '#f87171');
  drawLabel('G', G, -4, 18, '#a78bfa');
  drawLabel('H', H, 4, 18, '#a78bfa');

  // Congruence symbol
  drawLabel('Rt△BDG ≌ Rt△CEH', {x: 350, y: 490}, 0, 0, '#4ade80', 14);
}

function drawStep4() {
  clearCanvas();
  // Highlight triangles DGF and EHF
  drawTriangleFill(D, G, F, 'rgba(74,222,128,0.15)');
  drawTriangleFill(E, H, F, 'rgba(251,191,36,0.15)');

  // Base figure (lighter)
  drawLine(A, B, '#334155', 1);
  drawLine(A, C, '#334155', 1);
  drawLine(B, C, '#38bdf8', 1.5);
  drawLine(C, H, '#475569', 1.5, [4,4]);

  // DE full line
  drawLine(D, E, '#475569', 1);

  // DG and EH
  drawLine(D, G, '#a78bfa', 2.5, [6,3]);
  drawLine(E, H, '#a78bfa', 2.5, [6,3]);

  // Triangle DGF
  drawLine(D, G, '#4ade80', 2.5);
  drawLine(G, F, '#4ade80', 2.5);
  drawLine(D, F, '#4ade80', 2.5);

  // Triangle EHF
  drawLine(E, H, '#fbbf24', 2.5);
  drawLine(H, F, '#fbbf24', 2.5);
  drawLine(E, F, '#fbbf24', 2.5);

  // Right angle marks
  drawRightAngle(G, {x:0, y:-1}, {x:1, y:0}, 10, '#a78bfa');
  drawRightAngle(H, {x:0, y:-1}, {x:-1, y:0}, 10, '#a78bfa');

  // Vertical angles at F
  drawAngleArc(F, D, G, 16, '#4ade80', 2);
  drawAngleArc(F, E, H, 16, '#fbbf24', 2);

  // DG = EH triple ticks
  drawTickMark(D, G, 3, '#e879f9');
  drawTickMark(E, H, 3, '#e879f9');

  // Points
  drawPoint(A, '#475569', 3);
  drawPoint(B, '#38bdf8', 3);
  drawPoint(C, '#38bdf8', 3);
  drawPoint(D, '#4ade80', 4);
  drawPoint(E, '#fbbf24', 4);
  drawPoint(F, '#f87171', 5);
  drawPoint(G, '#a78bfa', 4);
  drawPoint(H, '#a78bfa', 4);

  drawLabel('A', A, 0, -18, '#475569');
  drawLabel('B', B, -18, 14, '#38bdf8');
  drawLabel('C', C, 0, 18, '#38bdf8');
  drawLabel('D', D, -20, -8, '#4ade80');
  drawLabel('E', E, 14, 12, '#fbbf24');
  drawLabel('F', F, 6, 18, '#f87171');
  drawLabel('G', G, -4, 18, '#a78bfa');
  drawLabel('H', H, 4, 18, '#a78bfa');

// ==================== NAVIGATION ====================
let currentStep = 1;
const totalSteps = 7;
const stepBtns = document.querySelectorAll('.step-btn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const stepIndicator = document.getElementById('stepIndicator');
const proofPanel = document.getElementById('proofPanel');

function goToStep(n) {
  if (n < 1 || n > totalSteps) return;
  currentStep = n;

  // Update step buttons
  stepBtns.forEach((btn, i) => {
    btn.classList.remove('active');
    if (i + 1 < n) btn.classList.add('completed');
    if (i + 1 === n) { btn.classList.add('active'); btn.classList.remove('completed'); }
    if (i + 1 > n) btn.classList.remove('completed');
  });

  // Update nav buttons
  prevBtn.disabled = (n === 1);
  nextBtn.disabled = (n === totalSteps);
  nextBtn.textContent = (n === totalSteps) ? '已完成 ✓' : '下一步 ▶';
  stepIndicator.textContent = `步骤 ${n} / ${totalSteps}`;

  // Draw canvas
  drawFunctions[n]();

  // Update proof panel
  proofPanel.innerHTML = getProofHTML(n);
  proofPanel.scrollTop = 0;

  // Re-render KaTeX
  renderMathInElement(proofPanel, {
    delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '$', right: '$', display: false}
    ],
    throwOnError: false
  });
}

// Event listeners
stepBtns.forEach(btn => {
  btn.addEventListener('click', () => goToStep(parseInt(btn.dataset.step)));
});
prevBtn.addEventListener('click', () => goToStep(currentStep - 1));
nextBtn.addEventListener('click', () => goToStep(currentStep + 1));

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); goToStep(currentStep - 1); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); goToStep(currentStep + 1); }
});

// Initialize
