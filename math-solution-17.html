<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>几何证明题 - CE = ½BF</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-tertiary: #334155;
      --text-primary: #f1f5f9;

    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);

      font-size: 16px;

    }
    .header .problem-text {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .step-nav {
      display: flex;
      gap: 6px;
      padding: 10px 24px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--bg-tertiary);

    }
    .step-btn {
      padding: 6px 14px;
      border: 1px solid var(--bg-tertiary);

      background: var(--accent-blue);

    }
    .step-btn.completed {
      border-color: var(--accent-green);

    }
    .main-area {
      display: flex;
      flex-direction: row;

    .canvas-panel {
      flex: 0 0 50%;

      border-radius: 8px;

      flex: 1;

    }

    }
    .nav-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 24px;

      right: 0;
    }
    .nav-btn {
      padding: 8px 20px;

</head>
<body>
  <div class="header">
    <h1>📐 第17题 · 几何证明</h1>
    <div class="problem-text">
      已知：△ABC中，∠ABC＝45°，CD⊥AB于D，BE平分∠ABC，且BE⊥AC于E，与CD相交于点F。求证：$CE = \frac{1}{2}BF$
    </div>
  </div>
  <div class="step-nav" id="stepNav"></div>
  <div class="main-area">
    <div class="canvas-panel">
      <canvas id="geo" width="520" height="460"></canvas>
    </div>
    <div class="proof-panel" id="proofPanel"></div>
  </div>
  <div class="nav-footer">
    <button class="nav-btn" id="prevBtn" onclick="goToStep(currentStep-1)">◀ 上一步</button>
    <span class="nav-info" id="navInfo"></span>
    <button class="nav-btn" id="nextBtn" onclick="goToStep(currentStep+1)">下一步 ▶</button>
  </div>

  <script>
    // ========== 坐标系统 ==========
    const W = 520, H = 460;
    const dpr = window.devicePixelRatio || 1;
    const canvas = document.getElementById('geo');
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    // 几何坐标 → 画布坐标
    // 设 B=(0,0), A=(10,0), C=(7.071,7.071), 画布映射
    const scale = 38;
    const ox = 80, oy = H - 60; // B点画布位置
    function toCanvas(gx, gy) {
      return [ox + gx * scale, oy - gy * scale];
    }

    // 几何点
    const a = 10; // BA=BC
    const sqrt2 = Math.sqrt(2);
    const gB = [0, 0];
    const gA = [a, 0];
    const gC = [a * Math.cos(Math.PI/4), a * Math.sin(Math.PI/4)]; // (7.071, 7.071)
    const gD = [gC[0], 0];
    // E: BE⊥AC, E on AC
    const ACx = gC[0] - gA[0], ACy = gC[1] - gA[1];
    const t_E = -gA[0] * ACx / (ACx*ACx + ACy*ACy);
    const gE = [gA[0] + t_E * ACx, gA[1] + t_E * ACy];
    // F: intersection of BE and CD (x=gC[0])
    const lam = gC[0] / gE[0];
    const gF = [lam * gE[0], lam * gE[1]];
    // M: midpoint of BF
    const gM = [(gB[0]+gF[0])/2, (gB[1]+gF[1])/2];

    // ========== 绘图工具 ==========
    function drawLine(p1, p2, color, width=2, dash=[]) {
      const [x1,y1] = toCanvas(...p1);
      const [x2,y2] = toCanvas(...p2);
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.setLineDash(dash);
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x2,y2);
      ctx.stroke();
      ctx.restore();
    }

    function drawPoint(p, label, color='#f1f5f9', offset=[8,-12], size=4) {
      const [x,y] = toCanvas(...p);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = color;
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText(label, x+offset[0], y+offset[1]);
    }

    function drawRightAngle(vertex, p1, p2, size=12, color='#94a3b8') {
      const [vx,vy] = toCanvas(...vertex);
      const [x1,y1] = toCanvas(...p1);
      const [x2,y2] = toCanvas(...p2);
      const d1x = x1-vx, d1y = y1-vy;
      const l1 = Math.sqrt(d1x*d1x+d1y*d1y);
      const d2x = x2-vx, d2y = y2-vy;
      const l2 = Math.sqrt(d2x*d2x+d2y*d2y);
      const u1x = d1x/l1*size, u1y = d1y/l1*size;
      const u2x = d2x/l2*size, u2y = d2y/l2*size;
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(vx+u1x, vy+u1y);
      ctx.lineTo(vx+u1x+u2x, vy+u1y+u2y);
      ctx.lineTo(vx+u2x, vy+u2y);
      ctx.stroke();
      ctx.restore();
    }

    function drawAngleArc(vertex, p1, p2, radius, label, color='#fbbf24') {
      const [vx,vy] = toCanvas(...vertex);
      const [x1,y1] = toCanvas(...p1);
      const [x2,y2] = toCanvas(...p2);
      let a1 = Math.atan2(y1-vy, x1-vx);
      let a2 = Math.atan2(y2-vy, x2-vx);
      // ensure we draw the smaller arc
      let diff = a2 - a1;
      if (diff > Math.PI) a2 -= 2*Math.PI;
      if (diff < -Math.PI) a2 += 2*Math.PI;
      if (a1 > a2) { let tmp=a1; a1=a2; a2=tmp; }
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(vx, vy, radius, a1, a2);
      ctx.stroke();
      if (label) {
        const mid = (a1+a2)/2;
        const lx = vx + (radius+14)*Math.cos(mid);
        const ly = vy + (radius+14)*Math.sin(mid);
        ctx.fillStyle = color;
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(label, lx, ly);
      }
      ctx.restore();
    }

    function highlightLine(p1, p2, color, width=4) {
      const [x1,y1] = toCanvas(...p1);
      const [x2,y2] = toCanvas(...p2);
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.shadowColor = color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x2,y2);
      ctx.stroke();
      ctx.restore();
    }

    function drawTriangleFill(p1, p2, p3, color) {
      const [x1,y1] = toCanvas(...p1);
      const [x2,y2] = toCanvas(...p2);
      const [x3,y3] = toCanvas(...p3);
      ctx.save();
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x2,y2);
      ctx.lineTo(x3,y3);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawMidpointMark(p1, p2, color='#94a3b8') {
      const [x1,y1] = toCanvas(...p1);
      const [x2,y2] = toCanvas(...p2);
      const mx = (x1+x2)/2, my = (y1+y2)/2;
      const dx = x2-x1, dy = y2-y1;
      const len = Math.sqrt(dx*dx+dy*dy);
      const nx = -dy/len*6, ny = dx/len*6;
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(mx-nx, my-ny);
      ctx.lineTo(mx+nx, my+ny);
      ctx.stroke();
      ctx.restore();
    }

    // ========== 步骤定义 ==========
    const steps = [
      {
        title: '分析题意',
        draw(s) {
          // 基本三角形
          drawLine(gB, gA, '#64748b');
          drawLine(gA, gC, '#64748b');
          drawLine(gB, gC, '#64748b');
          drawLine(gC, gD, '#64748b', 1.5, [4,4]);
          drawLine(gB, gE, '#64748b', 1.5, [4,4]);
          drawRightAngle(gD, gB, gC, 10);
          drawRightAngle(gE, gA, gF, 10);
          drawAngleArc(gB, gA, gC, 30, '45°', '#fbbf24');
          drawPoint(gB, 'B', '#f1f5f9', [-20, -5]);
          drawPoint(gA, 'A', '#f1f5f9', [8, 14]);
          drawPoint(gC, 'C', '#f1f5f9', [-8, -16]);
          drawPoint(gD, 'D', '#f1f5f9', [4, 18]);
          drawPoint(gE, 'E', '#f1f5f9', [10, 2]);
          drawPoint(gF, 'F', '#f1f5f9', [8, -4]);
        },
        html: `
          <h3><span class="step-icon">0</span> 分析题意</h3>
          <div class="proof-content">
            <p><strong>已知条件：</strong></p>
            <p>① $\\triangle ABC$ 中，$\\angle ABC = 45°$</p>
            <p>② $CD \\perp AB$ 于 $D$</p>
            <p>③ $BE$ 平分 $\\angle ABC$，且 $BE \\perp AC$ 于 $E$</p>
            <p>④ $BE$ 与 $CD$ 相交于点 $F$</p>
            <div class="key-eq">
              <strong>求证：</strong>$CE = \\dfrac{1}{2}BF$
            </div>
            <p><strong>解题思路概览：</strong></p>
            <p>1. 利用角平分线+垂直 → 推出等腰三角形</p>
            <p>2. 利用等腰直角三角形性质</p>
            <p>3. 构造两组相似三角形</p>
            <p>4. 利用相似比+勾股定理完成证明</p>
          </div>
        `
      },
      {
        title: '证BA=BC',
        draw(s) {
          drawLine(gB, gA, '#64748b');
          drawLine(gA, gC, '#64748b');
          drawLine(gB, gC, '#64748b');
          drawLine(gB, gE, '#38bdf8', 2);
          drawRightAngle(gE, gA, gF, 12, '#4ade80');
          // highlight ∠ABE and ∠CBE
          drawAngleArc(gB, gA, gE, 40, '22.5°', '#fb923c');
          drawAngleArc(gB, gE, gC, 28, '22.5°', '#fb923c');
          // highlight ∠BAE and ∠BCA
          drawAngleArc(gA, gB, gC, 22, '67.5°', '#a78bfa');
          drawAngleArc(gC, gA, gB, 22, '67.5°', '#a78bfa');
          // equal marks on BA and BC
          highlightLine(gB, gA, 'rgba(167,139,250,0.3)', 6);
          highlightLine(gB, gC, 'rgba(167,139,250,0.3)', 6);
          drawMidpointMark(gB, gA, '#a78bfa');
          drawMidpointMark(gB, gC, '#a78bfa');
          drawPoint(gB, 'B', '#f1f5f9', [-20, -5]);
          drawPoint(gA, 'A', '#f1f5f9', [8, 14]);
          drawPoint(gC, 'C', '#f1f5f9', [-8, -16]);
          drawPoint(gE, 'E', '#f1f5f9', [10, 2]);
        },
        html: `
          <h3><span class="step-icon">1</span> 证明 BA = BC（等腰三角形）</h3>
          <div class="proof-content">
            <p>∵ $BE$ 平分 $\\angle ABC = 45°$</p>
            <p>∴ $\\angle ABE = \\angle CBE = 22.5°$</p>
            <br>
            <p>∵ $BE \\perp AC$，即 $\\angle BEA = 90°$</p>
            <p>在 $\\text{Rt}\\triangle ABE$ 中：</p>
            <p>$\\angle BAE = 180° - 90° - 22.5° = 67.5°$</p>
            <br>
            <p>又 $\\angle ABC = 45°, \\; \\angle BAC = 67.5°$</p>
            <p>∴ $\\angle BCA = 180° - 45° - 67.5° = 67.5°$</p>
            <br>
            <div class="conclusion">
              <strong>∵ $\\angle BAC = \\angle BCA = 67.5°$</strong><br>
              <strong>∴ $BA = BC$（等腰三角形，等角对等边）</strong>
            </div>
          </div>
        `
      },
      {
        title: '等腰直角△BDC',
        draw(s) {
          drawLine(gB, gA, '#64748b', 1.5);
          drawLine(gA, gC, '#64748b', 1.5);
          drawLine(gB, gC, '#64748b');
          drawLine(gC, gD, '#38bdf8', 2);
          // highlight Rt△BDC
          drawTriangleFill(gB, gD, gC, 'rgba(56,189,248,0.08)');
          drawLine(gB, gD, '#38bdf8', 2.5);
          drawLine(gD, gC, '#38bdf8', 2.5);
          drawLine(gB, gC, '#38bdf8', 2.5);
          drawRightAngle(gD, gB, gC, 14, '#4ade80');
          drawAngleArc(gB, gA, gC, 30, '45°', '#fbbf24');
          drawAngleArc(gC, gD, gB, 22, '45°', '#fbbf24');
          // equal marks BD=CD
          drawMidpointMark(gB, gD, '#fb923c');
          drawMidpointMark(gD, gC, '#fb923c');
          drawPoint(gB, 'B', '#f1f5f9', [-20, -5]);
          drawPoint(gA, 'A', '#f1f5f9', [8, 14]);
          drawPoint(gC, 'C', '#f1f5f9', [-8, -16]);
          drawPoint(gD, 'D', '#f1f5f9', [4, 18]);
        },
        html: `
          <h3><span class="step-icon">2</span> Rt△BDC 是等腰直角三角形</h3>
          <div class="proof-content">
            <p>∵ $CD \\perp AB$ 于 $D$</p>
            <p>∴ $\\angle BDC = 90°$</p>
            <br>
            <p>在 $\\text{Rt}\\triangle BDC$ 中：</p>
            <p>$\\angle DBC = \\angle ABC = 45°$</p>
            <p>$\\angle BCD = 90° - 45° = 45°$</p>
            <br>
            <div class="conclusion">
              <strong>∵ $\\angle DBC = \\angle BCD = 45°$</strong><br>
              <strong>∴ $BD = CD$（等腰直角三角形）</strong><br>
              设 $BD = CD = a$，则 $BC = \\sqrt{2} \\cdot a$
            </div>
          </div>
        `
      },
      {
        title: '相似①: △BDF∼△BCE',
        draw(s) {
          drawLine(gB, gA, '#475569', 1);
          drawLine(gA, gC, '#475569', 1);
          drawLine(gB, gC, '#475569', 1);
          // △BDF
          drawTriangleFill(gB, gD, gF, 'rgba(251,146,60,0.12)');
          drawLine(gB, gD, '#fb923c', 2.5);
          drawLine(gD, gF, '#fb923c', 2.5);
          drawLine(gB, gF, '#fb923c', 2.5);
          // △BCE
          drawTriangleFill(gB, gC, gE, 'rgba(56,189,248,0.12)');
          drawLine(gB, gC, '#38bdf8', 2.5);
          drawLine(gC, gE, '#38bdf8', 2.5);
          drawLine(gB, gE, '#38bdf8', 2.5);
          // angles
          drawRightAngle(gD, gB, gF, 12, '#4ade80');
          drawRightAngle(gE, gC, gB, 12, '#4ade80');
          drawAngleArc(gB, gA, gE, 42, '22.5°', '#fbbf24');
          drawAngleArc(gB, gE, gC, 30, '22.5°', '#fbbf24');
          drawPoint(gB, 'B', '#f1f5f9', [-20, -5]);
          drawPoint(gA, 'A', '#f1f5f9', [8, 14]);
          drawPoint(gC, 'C', '#f1f5f9', [-8, -16]);
          drawPoint(gD, 'D', '#f1f5f9', [4, 18]);
          drawPoint(gE, 'E', '#f1f5f9', [10, 2]);
          drawPoint(gF, 'F', '#f1f5f9', [8, -4]);
        },
        html: `
          <h3><span class="step-icon">3</span> 第一组相似：Rt△BDF ∼ Rt△BCE</h3>
          <div class="proof-content">
            <p>在 $\\text{Rt}\\triangle BDF$ 和 $\\text{Rt}\\triangle BCE$ 中：</p>
            <br>
            <p>$\\angle BDF = \\angle BEC = 90°$</p>
            <p class="reason">（∵ $CD \\perp AB$ 且 $BE \\perp AC$）</p>
            <br>
            <p>$\\angle DBF = \\angle CBE = 22.5°$</p>
            <p class="reason">（∵ $BE$ 平分 $\\angle ABC$，$F$ 在 $BE$ 上）</p>
            <br>
            <div class="conclusion">
              <strong>∴ $\\text{Rt}\\triangle BDF \\sim \\text{Rt}\\triangle BCE$ (AA)</strong>
            </div>
            <br>
            <p>由相似可得：</p>
            <div class="key-eq">
              $\\dfrac{BD}{BE} = \\dfrac{BF}{BC}$<br><br>
              即 $BF = \\dfrac{BC \\cdot BD}{BE} = \\dfrac{\\sqrt{2}a^2}{BE}$ &nbsp;…(I)
            </div>
          </div>
        `
      },
      {
        title: '相似②: △CEF∼△BDF',
        draw(s) {
          drawLine(gB, gA, '#475569', 1);
          drawLine(gA, gC, '#475569', 1);
          drawLine(gB, gC, '#475569', 1);
          drawLine(gC, gD, '#475569', 1.5, [4,4]);
          drawLine(gB, gE, '#475569', 1.5, [4,4]);
          // △CEF
          drawTriangleFill(gC, gE, gF, 'rgba(74,222,128,0.12)');
          drawLine(gC, gE, '#4ade80', 2.5);
          drawLine(gE, gF, '#4ade80', 2.5);
          drawLine(gC, gF, '#4ade80', 2.5);
          // △BDF
          drawTriangleFill(gB, gD, gF, 'rgba(251,146,60,0.12)');
          drawLine(gB, gD, '#fb923c', 2.5);
          drawLine(gD, gF, '#fb923c', 2.5);
          drawLine(gB, gF, '#fb923c', 2.5);
          // angles
          drawRightAngle(gE, gC, gF, 12, '#4ade80');
          drawRightAngle(gD, gB, gF, 12, '#fb923c');
          // 对顶角
          drawAngleArc(gF, gD, gB, 18, '67.5°', '#f87171');
          drawAngleArc(gF, gC, gE, 18, '67.5°', '#f87171');
          drawPoint(gB, 'B', '#f1f5f9', [-20, -5]);
          drawPoint(gA, 'A', '#f1f5f9', [8, 14]);
          drawPoint(gC, 'C', '#f1f5f9', [-8, -16]);
          drawPoint(gD, 'D', '#f1f5f9', [4, 18]);
          drawPoint(gE, 'E', '#f1f5f9', [10, 2]);
          drawPoint(gF, 'F', '#f1f5f9', [-18, 4]);
        },
        html: `
          <h3><span class="step-icon">4</span> 第二组相似：Rt△CEF ∼ Rt△BDF</h3>
          <div class="proof-content">
            <p>在 $\\text{Rt}\\triangle CEF$ 和 $\\text{Rt}\\triangle BDF$ 中：</p>
            <br>
            <p>$\\angle CEF = \\angle BDF = 90°$</p>
            <p class="reason">（∵ $BE \\perp AC$ 且 $CD \\perp AB$）</p>
            <br>
            <p>$\\angle CFE = \\angle BFD$</p>
            <p class="reason">（对顶角相等）</p>
            <br>
            <div class="conclusion">
              <strong>∴ $\\text{Rt}\\triangle CEF \\sim \\text{Rt}\\triangle BDF$ (AA)</strong>
            </div>
            <br>
            <p>由相似可得：</p>
            <div class="key-eq">
              $\\dfrac{CE}{BD} = \\dfrac{CF}{BF}$<br><br>
              即 $CE = \\dfrac{BD \\cdot CF}{BF} = \\dfrac{a \\cdot CF}{BF}$ &nbsp;…(II)
            </div>
          </div>
        `
      },
      {
        title: '联立方程求解',
        draw(s) {
          drawLine(gB, gA, '#475569', 1);
          drawLine(gA, gC, '#475569', 1);
          drawLine(gB, gC, '#475569', 1);
          drawLine(gC, gD, '#38bdf8', 2);
          drawLine(gB, gE, '#38bdf8', 2);
          // highlight key segments
          highlightLine(gC, gE, 'rgba(74,222,128,0.4)', 5);
          highlightLine(gB, gF, 'rgba(251,146,60,0.4)', 5);
          // marks
          drawRightAngle(gD, gB, gC, 10);
          drawRightAngle(gE, gA, gF, 10);
          drawPoint(gB, 'B', '#f1f5f9', [-20, -5]);
          drawPoint(gA, 'A', '#f1f5f9', [8, 14]);
          drawPoint(gC, 'C', '#f1f5f9', [-8, -16]);
          drawPoint(gD, 'D', '#f1f5f9', [4, 18]);
          drawPoint(gE, 'E', '#f1f5f9', [10, 2]);
          drawPoint(gF, 'F', '#f1f5f9', [8, -4]);
          // 标注BD=CD=a
          const [bx,by] = toCanvas(...gB);
          const [dx,dy] = toCanvas(...gD);
          ctx.fillStyle = '#fb923c';
          ctx.font = 'italic 13px sans-serif';
          ctx.fillText('a', (bx+dx)/2, (by+dy)/2 + 18);
          const [cx,cy] = toCanvas(...gC);
          ctx.fillText('a', (dx+cx)/2 - 16, (dy+cy)/2);
        },
        html: `
          <h3><span class="step-icon">5</span> 联立方程求解</h3>
          <div class="proof-content">
            <p>由第一组相似 (I)：$BF = \\dfrac{\\sqrt{2}a^2}{BE}$</p>
            <p>由第二组相似 (II)：$CE = \\dfrac{a \\cdot CF}{BF}$</p>
            <br>
            <p>将 (I) 代入 (II)：</p>
            <div class="key-eq">
              $CE = \\dfrac{a \\cdot CF \\cdot BE}{\\sqrt{2}a^2} = \\dfrac{CF \\cdot BE}{\\sqrt{2}a}$
            </div>
            <p>由第一组相似还可得：$\\dfrac{DF}{CE} = \\dfrac{BD}{BE}$，即 $DF = \\dfrac{a \\cdot CE}{BE}$</p>
            <br>
            <p>又由第二组相似：$\\dfrac{CF}{BF} = \\dfrac{CE}{BD}$，所以：</p>
            <p>$CF = \\dfrac{BF \\cdot CE}{a} = \\dfrac{\\sqrt{2}a \\cdot CE}{BE}$</p>
            <br>
            <p>∵ $F$ 在线段 $CD$ 上，$DF + CF = CD = a$：</p>
            <div class="key-eq">
              $\\dfrac{a \\cdot CE}{BE} + \\dfrac{\\sqrt{2}a \\cdot CE}{BE} = a$
              <br><br>
              $\\dfrac{CE}{BE}(1 + \\sqrt{2}) = 1$
              <br><br>
              $CE = \\dfrac{BE}{1 + \\sqrt{2}}$
            </div>
          </div>
        `
      },
      {
        title: '完成证明',
        draw(s) {
          // 基础
          drawLine(gB, gA, '#475569', 1);
          drawLine(gA, gC, '#475569', 1);
          drawLine(gB, gC, '#475569', 1);
          drawLine(gC, gD, '#64748b', 1.5, [4,4]);
          drawLine(gB, gE, '#64748b', 1.5, [4,4]);
          // CE highlighted green
          highlightLine(gC, gE, 'rgba(74,222,128,0.6)', 6);
          // BF highlighted orange
          highlightLine(gB, gF, 'rgba(251,146,60,0.6)', 6);
          // Labels
          const [cx,cy] = toCanvas(...gC);
          const [ex,ey] = toCanvas(...gE);
          ctx.fillStyle = '#4ade80';
          ctx.font = 'bold 14px sans-serif';
          ctx.fillText('CE', (cx+ex)/2 + 4, (cy+ey)/2 - 10);
          const [bx,by] = toCanvas(...gB);
          const [fx,fy] = toCanvas(...gF);
          ctx.fillStyle = '#fb923c';
          ctx.fillText('BF', (bx+fx)/2 - 24, (by+fy)/2);
          // 等式
          ctx.fillStyle = '#fbbf24';
          ctx.font = 'bold 18px sans-serif';
          ctx.fillText('CE = ½BF ✓', toCanvas(2, 9.5)[0], toCanvas(2, 9.5)[1]);
          drawRightAngle(gD, gB, gC, 10);
          drawRightAngle(gE, gA, gF, 10);
          drawPoint(gB, 'B', '#f1f5f9', [-20, -5]);
          drawPoint(gA, 'A', '#f1f5f9', [8, 14]);
          drawPoint(gC, 'C', '#f1f5f9', [-8, -16]);
          drawPoint(gD, 'D', '#f1f5f9', [4, 18]);
          drawPoint(gE, 'E', '#f1f5f9', [10, 2]);
          drawPoint(gF, 'F', '#f1f5f9', [8, -4]);
        },
        html: `
          <h3><span class="step-icon">6</span> 完成证明 ✓</h3>
          <div class="proof-content">
            <p>由上一步得：$CE = \\dfrac{BE}{1 + \\sqrt{2}}$</p>
            <br>
            <p>而由 (I)：$\\dfrac{BF}{2} = \\dfrac{\\sqrt{2}a^2}{2BE}$</p>
            <br>
            <p>在 $\\text{Rt}\\triangle BEC$ 中（勾股定理）：</p>
            <p>$BE^2 + CE^2 = BC^2 = 2a^2$</p>
            <p>将 $CE = \\dfrac{BE}{1+\\sqrt{2}}$ 代入：</p>
            <p>$BE^2 + \\dfrac{BE^2}{(1+\\sqrt{2})^2} = 2a^2$</p>
            <p>$BE^2 \\cdot \\dfrac{(1+\\sqrt{2})^2 + 1}{(1+\\sqrt{2})^2} = 2a^2$</p>
            <p>$(1+\\sqrt{2})^2 = 3 + 2\\sqrt{2}$，$(1+\\sqrt{2})^2 + 1 = 4 + 2\\sqrt{2} = 2(2+\\sqrt{2})$</p>
            <div class="key-eq">
              $BE^2 = \\dfrac{2a^2(3+2\\sqrt{2})}{2(2+\\sqrt{2})} = \\dfrac{a^2(3+2\\sqrt{2})}{2+\\sqrt{2}}$
            </div>
            <p>有理化分母：$\\dfrac{3+2\\sqrt{2}}{2+\\sqrt{2}} \\cdot \\dfrac{2-\\sqrt{2}}{2-\\sqrt{2}} = \\dfrac{(3+2\\sqrt{2})(2-\\sqrt{2})}{2} = \\dfrac{6 - 3\\sqrt{2} + 4\\sqrt{2} - 4}{2} = \\dfrac{2+\\sqrt{2}}{2}$</p>
            <p>所以 $BE^2 = \\dfrac{a^2(2+\\sqrt{2})}{2}$</p>
            <br>
            <p>现在验证 $CE = \\dfrac{BF}{2}$：</p>
            <p>$CE = \\dfrac{BE}{1+\\sqrt{2}} = \\dfrac{BE(\\sqrt{2}-1)}{(1+\\sqrt{2})(\\sqrt{2}-1)} = BE(\\sqrt{2}-1)$</p>
            <br>
            <p>$\\dfrac{BF}{2} = \\dfrac{\\sqrt{2}a^2}{2BE}$</p>
            <br>
            <p>$CE = \\dfrac{BF}{2} \\iff BE(\\sqrt{2}-1) = \\dfrac{\\sqrt{2}a^2}{2BE}$</p>
            <p>$\\iff 2BE^2(\\sqrt{2}-1) = \\sqrt{2}a^2$</p>
            <p>代入 $BE^2 = \\dfrac{a^2(2+\\sqrt{2})}{2}$：</p>
            <p>左边 $= 2 \\cdot \\dfrac{a^2(2+\\sqrt{2})}{2} \\cdot (\\sqrt{2}-1) = a^2(2+\\sqrt{2})(\\sqrt{2}-1)$</p>
            <p>$= a^2(2\\sqrt{2} - 2 + 2 - \\sqrt{2}) = a^2 \\cdot \\sqrt{2}$</p>
            <p>右边 $= \\sqrt{2}a^2$ &nbsp; ✓</p>
            <br>
            <div class="conclusion">
              <strong>∴ 左边 = 右边，$CE = \\dfrac{1}{2}BF$ 得证。 $\\blacksquare$</strong>
            </div>
            <br>
            <div class="warning">
              💡 本题核心思路：BE平分角+BE⊥AC → 等腰三角形BA=BC → 等腰直角△BDC中BD=CD → 两组AA相似 → 代数推导等式成立。
            </div>
          </div>
        `
      }
    ];

    // ========== 交互控制 ==========
    let currentStep = 0;

    function buildNav() {
      const nav = document.getElementById('stepNav');
      nav.innerHTML = '';
      steps.forEach((s, i) => {
        const btn = document.createElement('button');
        btn.className = 'step-btn' + (i === currentStep ? ' active' : (i < currentStep ? ' completed' : ''));
        btn.textContent = (i === 0 ? '⓪' : '①②③④⑤⑥⑦⑧⑨'[i-1] || i) + ' ' + s.title;
        btn.onclick = () => goToStep(i);
        nav.appendChild(btn);
      });
    }

    function goToStep(idx) {
      if (idx < 0 || idx >= steps.length) return;
      currentStep = idx;
      buildNav();
      // Clear and redraw
      ctx.clearRect(0, 0, W, H);
      steps[currentStep].draw(currentStep);
      // Update proof
      document.getElementById('proofPanel').innerHTML = steps[currentStep].html;
      renderMathInElement(document.getElementById('proofPanel'), {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ]
      });
      // Update nav
      document.getElementById('prevBtn').disabled = (currentStep === 0);
      document.getElementById('nextBtn').disabled = (currentStep === steps.length - 1);
      document.getElementById('navInfo').textContent = `步骤 ${currentStep}/${steps.length - 1}`;
    }

    // Keyboard
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goToStep(currentStep + 1);
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goToStep(currentStep - 1);
    });

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      renderMathInElement(document.querySelector('.problem-text'), {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ]
      });
      goToStep(0);
    });
  </script>
</body>
</html>
